<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Tri7 Cinematics</title>
  <!-- Link to the single, merged CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <!-- Background shapes for the glassmorphism effect -->
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <form>
    <h3>Login Here</h3>

    <label for="username">Username</label>
    <input
      type="text"
      placeholder="Email or Phone"
      id="username"
      required
    />

    <label for="password">Password</label>
    <input
      type="password"
      placeholder="Password"
      id="password"
      required
    />

    <!-- Login button -->
    <button type="submit">Log In</button>

    <!-- Register button replaces Google/Facebook -->
    <div class="social">
      <button type="button" onclick="window.location.href='register.html'">
        Register
      </button>
    </div>
  </form>
</body>
</html>
